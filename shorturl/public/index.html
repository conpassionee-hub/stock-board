<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mtou · 단축 URL</title>
<meta name="description" content="긴 주소를 짧게! mtou 단축 URL 서비스">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/qrcode.js"></script>
</head>
<body>
<header class="top">
  <a class="logo" href="/"><b>mtou</b> 단축 URL</a>
  <span class="meta" id="meta"></span>
</header>

<main>
  <section class="hero">
    <h1>긴 주소를 짧고 깔끔하게</h1>
    <p>URL을 붙여넣고 줄이기를 누르면 <b id="exPrefix">/mtou/</b> 단축 주소가 만들어집니다.</p>
  </section>

  <form class="card" id="form" autocomplete="off">
    <div class="row">
      <input class="input" id="url" type="text" inputmode="url" placeholder="https://example.com/아주/긴/주소를/여기에" aria-label="줄일 URL" required>
      <button class="btn" id="go" type="submit">줄이기</button>
    </div>
    <details class="opts">
      <summary>원하는 주소로 만들기 (선택)</summary>
      <label class="alias">
        <span id="aliasBase">/mtou/</span>
        <input id="alias" type="text" placeholder="my-link" maxlength="30" aria-label="사용자 지정 별칭">
      </label>
    </details>
    <div class="msg" id="msg" role="alert"></div>

    <div class="result" id="result">
      <div class="info">
        <a class="short" id="short" target="_blank" rel="noopener"></a>
        <div class="orig" id="orig"></div>
        <div class="actions">
          <button class="btn sm" type="button" id="copy">복사</button>
          <button class="btn sm ghost" type="button" id="dlqr">QR 저장</button>
          <a class="btn sm ghost" id="stats" style="text-decoration:none;display:inline-flex;align-items:center">통계 보기</a>
        </div>
      </div>
      <div class="qr" id="qr" aria-label="QR 코드"></div>
    </div>
  </form>

  <div class="section-h">
    <h2>최근 만든 주소</h2>
    <button type="button" id="clear">기록 지우기</button>
  </div>
  <ul class="list" id="recent"></ul>

  <section class="features">
    <div class="feature"><h3>무료 · 무제한</h3><p>회원가입 없이 바로 짧은 주소를 만들 수 있어요.</p></div>
    <div class="feature"><h3>QR 코드</h3><p>단축 주소마다 QR 코드가 자동으로 생성됩니다.</p></div>
    <div class="feature"><h3>클릭 통계</h3><p>주소 뒤에 <code>+</code>를 붙이면 클릭 수를 확인할 수 있어요.</p></div>
  </section>
</main>

<footer>© mtou 단축 URL</footer>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const RECENT_KEY = 'mtou_recent';
let cfg = { baseUrl: location.origin, prefix: 'mtou' };

const store = {
  get() { try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; } },
  set(v) { try { localStorage.setItem(RECENT_KEY, JSON.stringify(v.slice(0, 20))); } catch {} },
};

function toast(t) {
  const el = $('toast'); el.textContent = t; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 1600);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast('복사되었습니다');
}

function renderQR(text) {
  const box = $('qr'); box.innerHTML = '';
  if (typeof qrcode !== 'function') { box.style.display = 'none'; $('dlqr').style.display = 'none'; return; }
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  box.innerHTML = qr.createImgTag(8, 8);
}

function showError(t) { const m = $('msg'); m.textContent = t; m.className = 'msg err'; }
function clearError() { $('msg').className = 'msg'; }

function renderRecent() {
  const list = store.get(), ul = $('recent');
  ul.innerHTML = '';
  if (!list.length) { ul.innerHTML = '<li class="empty" style="display:block">아직 만든 주소가 없습니다.</li>'; return; }
  for (const it of list) {
    const li = document.createElement('li');
    li.innerHTML = `<div class="l"><a class="s" target="_blank" rel="noopener"></a><div class="o"></div></div>
      <span class="c"></span><button class="btn sm ghost" type="button">복사</button>`;
    const a = li.querySelector('.s'); a.href = it.shortUrl; a.textContent = it.shortUrl.replace(/^https?:\/\//, '');
    li.querySelector('.o').textContent = it.url;
    li.querySelector('.c').textContent = new Date(it.at).toLocaleDateString('ko-KR');
    li.querySelector('button').onclick = () => copy(it.shortUrl);
    ul.appendChild(li);
  }
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault(); clearError();
  const url = $('url').value.trim(), alias = $('alias').value.trim();
  if (!url) return showError('URL을 입력해 주세요.');
  $('go').disabled = true; $('go').textContent = '줄이는 중…';
  try {
    const r = await fetch('/api/shorten', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url, alias }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || '실패했습니다.');
    $('short').href = d.shortUrl; $('short').textContent = d.shortUrl;
    $('orig').textContent = d.url; $('orig').title = d.url;
    $('stats').href = `/${cfg.prefix}/${d.code}+`;
    renderQR(d.shortUrl);
    $('result').classList.add('show');
    const list = store.get().filter((x) => x.shortUrl !== d.shortUrl);
    list.unshift({ shortUrl: d.shortUrl, url: d.url, at: Date.now() });
    store.set(list); renderRecent();
    $('alias').value = '';
  } catch (err) { showError(err.message); }
  finally { $('go').disabled = false; $('go').textContent = '줄이기'; }
});

$('copy').onclick = () => copy($('short').textContent);
$('dlqr').onclick = () => {
  const img = $('qr').querySelector('img'); if (!img) return;
  const a = document.createElement('a'); a.href = img.src;
  a.download = 'mtou-qr-' + $('short').textContent.split('/').pop() + '.gif'; a.click();
};
$('clear').onclick = () => { store.set([]); renderRecent(); };

fetch('/api/config').then((r) => r.json()).then((c) => {
  cfg = c;
  const base = c.baseUrl.replace(/^https?:\/\//, '') + '/' + c.prefix + '/';
  $('aliasBase').textContent = base; $('exPrefix').textContent = '/' + c.prefix + '/';
  $('meta').textContent = `누적 ${c.n.toLocaleString()}개 · 클릭 ${c.c.toLocaleString()}회`;
}).catch(() => {});
renderRecent();
</script>
</body>
</html>
